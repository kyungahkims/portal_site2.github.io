<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿠팡 즐겨찾기 포인트 애니메이션</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background: #f4f6fa;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #222;
  }

  .fav-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(120px, 1fr));
    gap: 28px;
    width: min(680px, calc(100vw - 32px));
    justify-items: center;
  }

  .stage {
    width: 160px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: #f8f9fc;
  }

  .fav {
    position: relative;
    width: 76px;
    height: 98px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .icon {
    position: relative;
    z-index: 2;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: #e83131;
    color: #fff;
    box-shadow: 0 8px 18px rgba(232, 49, 49, .25);
    font-size: 8px;
    font-weight: 800;
  }

  .label {
    color: #333;
    font-size: 12px;
    font-weight: 700;
  }

  .coin {
    position: absolute;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffdc3b;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #fff4a8 0 13%, #ffd72e 26%, #f0ad00 68%, #cf8500 100%);
    box-shadow: 0 8px 14px rgba(244, 170, 0, .35);
    color: #ba7900;
    font-size: 12px;
    font-weight: 900;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .5);
  }

  .coin::after {
    content: "P";
  }

  .badge {
    position: absolute;
    z-index: 6;
    min-width: 48px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0 9px;
    border-radius: 999px;
    box-shadow: 0 5px 12px rgba(0, 0, 0, .12);
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
  }

  .badge.black {
    background: #252529;
    color: #fff;
  }

  .badge.yellow {
    background: #ffe230;
    color: #222;
  }

  .spark {
    position: absolute;
    z-index: 5;
    color: #00c5e6;
    font-weight: 900;
  }

  .badge-word {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  .fav-a .coin.c1 {
    top: 16px;
    left: 46px;
    width: 26px;
    height: 26px;
    animation: coin-pop 2.6s infinite;
  }

  .fav-a .coin.c2 {
    top: 50px;
    right: 12px;
    width: 18px;
    height: 18px;
    font-size: 9px;
    animation: coin-float 2.6s .3s infinite;
  }

  .fav-a .badge {
    bottom: 48px;
    left: 10px;
    animation: label-in 2.6s infinite;
  }

  .fav-b .badge,
  .fav-c .badge {
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
  }

  .fav-b .badge {
    width: 70px;
    animation: ribbon-color 3.6s infinite;
  }

  .fav-b .coin,
  .fav-c .coin {
    top: 70px;
    right: 10px;
    width: 18px;
    height: 18px;
    font-size: 9px;
    opacity: 0;
    animation: coin-tiny 3.6s infinite;
  }

  .fav-b .spark {
    top: 23px;
    right: 0;
    opacity: 0;
    animation: spark-pop 3.6s infinite;
  }

  .fav-b .badge-word:nth-child(1),
  .fav-c .badge-word:nth-child(1) {
    animation: word-1 3.6s infinite;
  }

  .fav-b .badge-word:nth-child(2),
  .fav-c .badge-word:nth-child(2) {
    animation: word-2 3.6s infinite;
  }

  .fav-b .badge-word:nth-child(3),
  .fav-c .badge-word:nth-child(3) {
    animation: word-3 3.6s infinite;
  }

  .fav-b .badge-word:nth-child(4),
  .fav-c .badge-word:nth-child(4) {
    animation: word-4 3.6s infinite;
  }

  .fav-c .badge {
    width: 70px;
    background: #252529;
    color: #fff;
    animation: roll-color 3.6s infinite;
  }

  .fav-c .coin {
    top: 67px;
    right: 9px;
    width: 20px;
    height: 20px;
  }

  @keyframes coin-pop {
    0%, 18% {
      opacity: 0;
      transform: translateY(20px) scale(.2);
    }
    32% {
      opacity: 1;
      transform: translateY(-12px) scale(1.1);
    }
    48%, 85% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(-12px) scale(.8);
    }
  }

  @keyframes coin-float {
    0%, 28% {
      opacity: 0;
      transform: translateY(14px) scale(.4);
    }
    45%, 82% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(-10px);
    }
  }

  @keyframes label-in {
    0%, 32% {
      opacity: 0;
      transform: translateY(8px);
    }
    42%, 84% {
      opacity: 1;
      transform: translateY(0);
    }
    100% {
      opacity: 0;
    }
  }

  @keyframes ribbon-color {
    0%, 49% {
      background: #ffe230;
      color: #222;
    }
    50%, 100% {
      background: #15c9e7;
      color: #fff;
    }
  }

  @keyframes roll-color {
    0%, 49% {
      background: #252529;
    }
    50%, 100% {
      background: #15c9e7;
    }
  }

  @keyframes coin-tiny {
    0%, 50% {
      opacity: 0;
      transform: scale(.3);
    }
    60%, 86% {
      opacity: 1;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(-8px);
    }
  }

  @keyframes spark-pop {
    0%, 65% {
      opacity: 0;
      transform: scale(.4);
    }
    75%, 90% {
      opacity: 1;
      transform: scale(1);
    }
    100% {
      opacity: 0;
    }
  }

  @keyframes word-1 {
    0%, 24% {
      opacity: 1;
      transform: translateY(0);
    }
    25%, 100% {
      opacity: 0;
      transform: translateY(-8px);
    }
  }

  @keyframes word-2 {
    0%, 24%, 50%, 100% {
      opacity: 0;
      transform: translateY(8px);
    }
    25%, 49% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes word-3 {
    0%, 49%, 75%, 100% {
      opacity: 0;
      transform: translateY(8px);
    }
    50%, 74% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes word-4 {
    0%, 74% {
      opacity: 0;
      transform: translateY(8px);
    }
    75%, 100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 520px) {
    .fav-list {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <main class="fav-list" aria-label="쿠팡 즐겨찾기 포인트 애니메이션 3종">
    <div class="stage">
      <div class="fav fav-a" aria-label="코인 팝업형">
        <div class="icon">coupang</div>
        <div class="label">쿠팡</div>
        <div class="coin c1"></div>
        <div class="coin c2"></div>
        <div class="badge black">접속만 해도</div>
      </div>
    </div>

    <div class="stage">
      <div class="fav fav-b" aria-label="말풍선 리본형">
        <div class="icon">coupang</div>
        <div class="label">쿠팡</div>
        <div class="badge yellow" aria-hidden="true">
          <span class="badge-word">포인트</span>
          <span class="badge-word">들어가면</span>
          <span class="badge-word">바로 1P</span>
          <span class="badge-word">적립완료</span>
        </div>
        <div class="coin"></div>
        <div class="spark">✦</div>
      </div>
    </div>

    <div class="stage">
      <div class="fav fav-c" aria-label="롤링 문구형">
        <div class="icon">coupang</div>
        <div class="label">쿠팡</div>
        <div class="badge" aria-hidden="true">
          <span class="badge-word">1P?</span>
          <span class="badge-word">받아가</span>
          <span class="badge-word">접속하면</span>
          <span class="badge-word">+1~10P</span>
        </div>
        <div class="coin"></div>
      </div>
    </div>
  </main>
</body>
</html>
